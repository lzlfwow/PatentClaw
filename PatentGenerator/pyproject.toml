[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patent-generator"
version = "0.1.0"
description = "An evidence-grounded multi-agent pipeline that turns LaTeX papers into Chinese technical disclosure documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "openai>=2,<3",
  "python-docx>=1.1,<2",
  "pillow>=10.3,<13",
  "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[project.scripts]
latex2disclosure = "latex2disclosure.cli:main"
latex2disclosure-api = "latex2disclosure.cli:serve"

[tool.hatch.build.targets.wheel]
packages = ["latex2disclosure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
