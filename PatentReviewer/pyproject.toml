[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-reviewer"
version = "0.1.0"
description = "Evidence-grounded review and revision of Chinese patent technical disclosure drafts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "openai>=2,<3",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[project.scripts]
patent-reviewer = "patent_reviewer.cli:main"
patent-reviewer-api = "patent_reviewer.cli:serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["patent_reviewer*"]

[tool.setuptools.package-data]
patent_reviewer = ["policies/*.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
